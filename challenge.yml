name: "The Emperor's Imperial Seal"
author: "AdwaCTF"
category: forensics
description: |-
  A courier galloping south from Emperor Menelik's war camp carried an embroidered
  woodcut banner depicting the Imperial Seal of Ethiopia (Moa Anbessa).
  
  Italian border sentries inspected the parchment but found only an artistic
  rendering of the imperial tricolor and motto. However, our intelligence
  officers suspect the courier concealed a secret imperial decree inside the file
  using dual-layered steganographic techniques.
  
  Carve out the hidden container past the image boundary, recover the imperial passkey
  concealed within the pixel raster, and decipher the Emperor's proclamation.
  
  Flag format: `AdwaCTF{...}`
value: 200
type: dynamic
flags:
  - AdwaCTF{m04_4nb3554_z31mn3g3d3_y1hud4}
tags:
  - easy-medium
  - forensics
  - steganography
  - file-carving
  - lsb
  - dynamic-flag
files:
  - output/imperial_seal.png
  - output/courier_dossier.txt
generator:
  enabled: true
  image: "ghcr.io/azariyasmekonen/emperors-imperial-seal:latest"
  output_filename: "imperial_seal.png"
  timeout: 30
  cache_ttl: 72
hints:
  - content: "Examine the file structure past the standard PNG 'IEND' chunk. Standard utilities like binwalk, foremost, or a hex editor can carve the appended archive."
    cost: 20
  - content: "The carved decree is encrypted. Inspect the least significant bits (LSB) of the Red channel in the PNG image raster (using zsteg, StegSolve, or Python) to recover the IMPERIAL_PASSKEY."
    cost: 40
state: visible
version: "0.2"
