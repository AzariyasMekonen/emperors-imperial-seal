description: |-
  A courier galloping south from Emperor Menelik's war camp carried an embroidered
  woodcut banner depicting the Imperial Seal of Ethiopia (Moa Anbessa).
  
  Italian border sentries inspected the parchment but found only an artistic
  rendering of the imperial tricolor and motto. However, our intelligence
  officers suspect the courier concealed a secret imperial decree inside the file.
  
  Analyze the image structures to carve out the hidden proclamation and recover the flag.
  
